name: Build R3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract R3 project
        run: |
          rm -rf r-build
          unzip -q R3.zip -d r-build
          test -f r-build/R-final/settings.gradle.kts
          echo "R3 project found successfully"

      - name: Decode signing keystore
        env:
          R_KEYSTORE_BASE64: ${{ secrets.R_KEYSTORE_BASE64 }}
        run: |
          echo "$R_KEYSTORE_BASE64" | base64 --decode > r-build/R-final/r-release.jks
          test -s r-build/R-final/r-release.jks

      - name: Build R3 signed APK
        working-directory: r-build/R-final
        env:
          R_KEYSTORE_PATH: ${{ github.workspace }}/r-build/R-final/r-release.jks
          R_KEYSTORE_PASSWORD: ${{ secrets.R_KEYSTORE_PASSWORD }}
          R_KEY_ALIAS: ${{ secrets.R_KEY_ALIAS }}
          R_KEY_PASSWORD: ${{ secrets.R_KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp r-build/R-final/app/build/outputs/apk/release/app-release.apk \
             r-build/R-final/app/build/outputs/apk/release/R3.apk

      - name: Upload R3 APK
        uses: actions/upload-artifact@v4
        with:
          name: R3-signed-APK
          path: r-build/R-final/app/build/outputs/apk/release/R3.apk
