name: Build R2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract R2 project
        run: |
          rm -rf r-build
          unzip -q R2.zip -d r-build
          test -f r-build/R-final/settings.gradle.kts
          echo "R2 project found successfully"

      - name: Build R2 APK
        working-directory: r-build/R-final
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload R2 APK
        uses: actions/upload-artifact@v4
        with:
          name: R2-debug-APK
          path: r-build/R-final/app/build/outputs/apk/debug/app-debug.apk
